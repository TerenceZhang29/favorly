name: CI

on:
  push:
    branches: [main, "phase/**", "ci/**", "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (swift test)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version
          swift --version
      # Dependencies and earlier build output, so only changed modules compile. A new dependency pin starts over.
      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: Packages/FavorlyKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift') }}-
      - name: Run package tests
        run: swift test --package-path Packages/FavorlyKit

  # On GitHub only the core-flow UI test runs (DemoFlowUITests.testDemoScript: browse, post, pick up,
  # complete, reset), on main and when started by hand (gh workflow run ci.yml --ref <branch>). The full UI
  # suite runs locally before a push to main; it takes two to three times longer on GitHub's machines.
  app-tests:
    name: App build and core-flow UI test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # The build and test steps stop first, so a slow run still shows its failures, uploads its results and
    # saves its build cache.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      # Restored here and saved at the end even when the job fails: with the cache saved only on success, a run
      # of failures meant every run built from nothing and ran out of time.
      - name: Restore the app build
        uses: actions/cache/restore@v4
        with:
          path: DerivedData
          key: >-
            xcode-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: xcode-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift', 'project.yml') }}-
      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | map(.value |= map(select(.name | startswith("iPhone"))))
            | map(select(.value | length > 0))
            | sort_by(.key) | last | .value[0].udid')
          test -n "$udid" && test "$udid" != "null"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      # A cold simulator can make the first app launch time out ("Timed out while launching application"),
      # so boot it and wait until it is ready before the test starts.
      - name: Boot the simulator
        run: |
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build the app and tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet -project Favorly.xcodeproj -scheme Favorly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath DerivedData 2>&1 | tee build.log
      # Only the one UI test: the package tests already ran in the job above.
      # About 12 minutes on GitHub's machines (95 seconds on a Mac), plus Xcode's wrap-up; see docs/PROGRESS.md.
      - name: Run the core-flow UI test
        timeout-minutes: 25
        # Longer waits in the tests here; see UITestCase.waitTimeout.
        env:
          TEST_RUNNER_SLOW_MACHINE: "1"
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Favorly.xcodeproj -scheme Favorly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath DerivedData \
            -only-testing:FavorlyUITests/DemoFlowUITests/testDemoScript \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild.log | grep --line-buffered -E "Test Case|error:|TEST|t = .*(Tap|Waiting)"
      - name: Save the app build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: DerivedData
          key: >-
            xcode-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift', 'project.yml') }}-${{ github.sha }}
      - name: Show failures
        if: failure()
        run: |
          grep -nE "error:|: Test failed|' failed \\(|XCTAssert|Failed to|Assertion Failure" build.log xcodebuild.log \
            2>/dev/null | head -n 200 || true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
