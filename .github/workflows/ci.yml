name: CI

on:
  push:
    branches: [main, "phase/**", "ci/**", "claude/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: Package tests (swift test)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          ls /Applications | grep -i xcode
          xcodebuild -version
          swift --version
      # Dependencies and earlier build output, so only changed modules compile. A new dependency pin starts over.
      - name: Cache the package build
        uses: actions/cache@v4
        with:
          path: Packages/FavorlyKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift') }}-
      - name: Run package tests
        run: swift test --package-path Packages/FavorlyKit

  # The UI suite is long on GitHub's machines, so it runs on main and when started by hand
  # (gh workflow run ci.yml --ref <branch>), like the full suite runs locally only before a push to main.
  app-tests:
    name: App and UI tests (xcodebuild test)
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    # The UI suite takes about 13 minutes back to back on a laptop and two to three times that here. The test
    # step stops first, so a slow run still shows its failures and uploads its results.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Cache the app build
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: >-
            xcode-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: xcode-${{ runner.os }}-${{ hashFiles('Packages/FavorlyKit/Package.swift', 'project.yml') }}-
      - name: Pick an iPhone simulator
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | contains("iOS")))
            | map(.value |= map(select(.name | startswith("iPhone"))))
            | map(select(.value | length > 0))
            | sort_by(.key) | last | .value[0].udid')
          test -n "$udid" && test "$udid" != "null"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build and run all tests
        timeout-minutes: 50
        run: |
          set -o pipefail
          xcodebuild test -project Favorly.xcodeproj -scheme Favorly \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult 2>&1 | tee xcodebuild.log | tail -n 400
      - name: Show failures
        if: failure()
        run: |
          grep -nE "error:|: Test failed|' failed \\(|XCTAssert|Failed to|Assertion Failure" xcodebuild.log | head -n 200
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
