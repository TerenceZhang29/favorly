name: Favorly

options:
  bundleIdPrefix: edu.cornelltech.team402
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  FavorlyKit:
    path: Packages/FavorlyKit

targets:
  Favorly:
    type: application
    platform: iOS
    sources:
      - App
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - package: FavorlyKit
        product: FavorlyCore
      - package: FavorlyKit
        product: FavorlyData
      - package: FavorlyKit
        product: FavorlyFeatures
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAVORLY_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Favorly
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  FavorlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - AppUITests
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: Favorly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FAVORLY_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Favorly

schemes:
  Favorly:
    build:
      targets:
        Favorly: all
        FavorlyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: FavorlyKit/FavorlyCoreTests
        - package: FavorlyKit/FavorlyDataTests
        - package: FavorlyKit/FavorlyFeaturesTests
        # Each UI test class runs on its own clone of the simulator.
        - name: FavorlyUITests
          parallelizable: true
